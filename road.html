<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcin Fracz — The Road (v3 greybox)</title>
<meta name="description" content="Greybox draft of The Road v3: plain grey blocks, no art or 3D yet. Story, snap stops and layout only.">
<meta name="robots" content="noindex, nofollow">
<style>
  /* ---- v3 theme tokens (from the brief) ---- */
  :root{
    --sky1:#E9EDF2; --sky2:#F4F1EA; --terrain:#C9D2DC; --road:#8C99A8;
    --lane:#F4F1EA; --object:#DCE2E9; --object-shadow:#B8C2CD;
    --card:#FAFAF7; --card-border:#D5DCE4;
    --ink:#1E2124; --muted:#4A5562;
    --accent:#E8A33D; --accent-text:#8A520C; --link:#2563EB;
    --grey-box:#DCE2E9; --grey-box-border:#8C99A8; --grey-box-text:#4A5562;
    --header-h:96px; --header-bg:#FAFAF7;
  }
  [data-theme="dark"]{
    --sky1:#0E1114; --sky2:#161A20; --terrain:#1A1F26; --road:#262D36;
    --lane:#3A4350; --object:#222831; --object-shadow:#2E3640;
    --card:#161A20; --card-border:#2A313B;
    --ink:#ECEEF1; --muted:#A3ACB8;
    --accent:#F2B456; --accent-text:#F2B456; --link:#6B9BFF;
    --grey-box:#222831; --grey-box-border:#3A4350; --grey-box-text:#A3ACB8;
    --header-bg:#161A20;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    background:linear-gradient(var(--sky1), var(--sky2));
    color:var(--ink);
    font-family:Inter,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font-family:inherit;cursor:pointer}

  /* ---- fixed header band: nothing ever enters it ---- */
  header{
    position:fixed; inset:0 0 auto 0; z-index:100;
    height:var(--header-h);
    background:var(--header-bg);
    border-bottom:1px solid var(--card-border);
    display:flex; flex-direction:column; justify-content:center;
    padding:0 20px; gap:6px;
  }
  .head-row{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .brand{font-weight:900; letter-spacing:.12em; font-size:14px; text-decoration:none; display:flex; align-items:center; gap:8px; white-space:nowrap}
  .brand .home-ico{font-size:15px}
  .brand span{color:var(--accent-text)}
  .head-links{display:flex; align-items:center; gap:16px; font-size:12px; letter-spacing:.1em; text-transform:uppercase}
  .head-links a{opacity:.75; text-decoration:none}
  .head-links a:hover{opacity:1}
  .head-status{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--muted); letter-spacing:.06em; white-space:nowrap}
  #theme-toggle{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--ink); background:var(--card); color:var(--ink); font-size:15px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none}
  /* left-to-right progress arrow: 7 era segments + arrowhead */
  .progress-arrow{display:flex; align-items:stretch; gap:0; overflow-x:auto; scrollbar-width:none; padding-bottom:1px}
  .progress-arrow::-webkit-scrollbar{display:none}
  .progress-arrow button{
    flex:1 1 0; min-width:86px; border:1px solid var(--card-border);
    background:var(--grey-box); color:var(--grey-box-text);
    font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    padding:7px 10px 7px 16px; text-align:left; white-space:nowrap;
    clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%, 10px 50%);
    margin-left:-6px;
  }
  .progress-arrow button:first-child{clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 50%, calc(100% - 10px) 100%, 0 100%); margin-left:0; padding-left:10px}
  .progress-arrow button[aria-current="true"]{background:var(--accent); color:#1E2124}
  .progress-arrow button:focus-visible{outline:2px solid var(--link); outline-offset:2px}

  /* ---- prev / next: fixed at screen edges, in the gutter, never over content ---- */
  .edge-btn{
    position:fixed; top:50%; transform:translateY(-50%); z-index:90;
    width:44px; height:44px; border-radius:50%;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink);
    font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .edge-btn:disabled{opacity:.3; cursor:default}
  #prev-btn{left:12px}
  #next-btn{right:12px}

  /* ---- track: horizontal ONLY on laptop/tablet ---- */
  #track{
    display:flex; height:100vh; height:100svh;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  #track::-webkit-scrollbar{display:none}
  .panel{
    flex:0 0 100vw; width:100vw; height:100%;
    scroll-snap-align:start; scroll-snap-stop:always;
    padding:calc(var(--header-h) + 18px) 72px 24px;
    display:flex; flex-direction:column; justify-content:flex-start;
  }
  .panel-inner{max-width:1180px; width:100%; margin:0 auto; min-height:0; overflow-y:auto; scrollbar-width:none}
  .panel-inner::-webkit-scrollbar{display:none}
  /* Safety net only: on a normal laptop this never scrolls. On a very
     short viewport it keeps long stops readable instead of overlapping
     or clipping. The page itself never scrolls vertically. */
  @media (max-width:1150px){
    .panel{padding-left:64px; padding-right:64px}
    .stop-grid{grid-template-columns:minmax(240px,300px) minmax(220px,1fr) minmax(180px,240px); gap:12px}
    .hero-box{min-height:200px; padding:14px}
    .stop-card{padding:16px}
  }
  .stop-kicker{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
  .stop-kicker b{color:var(--accent-text)}
  /* safe zones: card | hero placeholder | callout placeholders. Nothing overlaps. */
  .stop-grid{display:grid; grid-template-columns:minmax(280px,360px) minmax(260px,1fr) minmax(210px,280px); gap:20px; align-items:start}
  .stop-card{background:var(--card); border:1px solid var(--card-border); padding:20px 22px}
  .stop-card h2{font-size:clamp(24px,2.6vw,36px); line-height:1.05; font-weight:900; letter-spacing:-.01em; margin-bottom:6px}
  .stop-card .role{font-size:14px; line-height:1.45; color:var(--ink); margin-bottom:10px}
  .stop-card .meta{font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted); line-height:1.6; margin-bottom:12px}
  .stop-card .what{font-size:15px; line-height:1.55; margin-bottom:14px}
  .wins{list-style:none; display:flex; flex-direction:column; gap:8px}
  .wins li{border-left:3px solid var(--accent); padding:2px 0 2px 10px; font-size:13.5px; line-height:1.45}
  .wins li b{font-size:15px}
  .more-btn{margin-top:14px; border:1.5px solid var(--ink); background:transparent; color:var(--ink); border-radius:999px; padding:8px 14px; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase}
  .more-btn[aria-expanded="true"]{background:var(--ink); color:var(--card)}
  .hero-box{
    background:var(--grey-box); border:2px dashed var(--grey-box-border);
    min-height:260px; padding:20px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px;
  }
  .hero-box .ph-label{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--grey-box-text)}
  .hero-box .ph-title{font-size:17px; font-weight:800; line-height:1.3}
  .hero-box .ph-note{font-size:13px; line-height:1.5; color:var(--grey-box-text); max-width:340px}
  .callouts{display:flex; flex-direction:column; gap:12px}
  .callout-box{background:var(--grey-box); border:1.5px dashed var(--grey-box-border); padding:12px 14px}
  .callout-box .ph-label{font-family:"JetBrains Mono",monospace; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--grey-box-text); display:block; margin-bottom:5px}
  .callout-box .ph-title{font-size:13.5px; font-weight:800; line-height:1.3}
  .callout-box p{font-size:13px; line-height:1.5; color:var(--grey-box-text); margin-top:4px}
  .callout-none{font-size:12px; color:var(--muted); font-family:"JetBrains Mono",monospace}
  .note-box{grid-column:1 / -1; background:var(--grey-box); border:1px dashed var(--grey-box-border); padding:12px 16px; font-size:12.5px; line-height:1.55; color:var(--grey-box-text); margin-top:20px}
  .note-box b{color:var(--ink)}
  .more-box{grid-column:1 / -1; background:var(--card); border:1px solid var(--card-border); padding:16px 18px; margin-top:20px}
  .more-box h3{font-size:13px; letter-spacing:.16em; text-transform:uppercase; margin-bottom:8px}
  .more-box p{font-size:14px; line-height:1.6}
  .more-box .open-flag{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--accent-text); margin-top:8px}
  [hidden]{display:none !important}

  /* intro + finale panels */
  .panel-intro .panel-inner, .panel-finale .panel-inner{max-width:820px; text-align:left}
  .panel-intro h1{font-size:clamp(52px,9vw,120px); line-height:.92; font-weight:900; letter-spacing:-.03em}
  .panel-intro h1 em{font-style:normal; color:var(--accent-text)}
  .panel-intro .lede{margin-top:20px; font-size:clamp(16px,1.6vw,21px); line-height:1.55; max-width:560px}
  .panel-intro .tagline{margin-top:22px; font-size:clamp(18px,2vw,26px); font-weight:800; line-height:1.3}
  .panel-intro .hint{margin-top:28px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  .panel-finale h2{font-size:clamp(36px,5vw,64px); line-height:.95; font-weight:900; letter-spacing:-.02em}
  .panel-finale p{margin-top:16px; font-size:16px; line-height:1.55; max-width:520px}
  .panel-finale .home-btn{display:inline-block; margin-top:26px; background:var(--accent); color:#1E2124; border:1.5px solid #1E2124; border-radius:999px; padding:14px 24px; font-size:14px; font-weight:800; letter-spacing:.06em; text-decoration:none}
  .panel-finale .fine-links{margin-top:22px; display:flex; gap:20px; font-size:12px; letter-spacing:.1em; text-transform:uppercase; flex-wrap:wrap}
  .panel-finale .fine-links a{opacity:.75}
  .error-box{padding:calc(var(--header-h) + 24px) 24px; max-width:720px; font-size:15px; line-height:1.6}

  /* ---- phones (<768px): vertical ONLY ---- */
  @media (max-width:767px){
    :root{--header-h:104px}
    html,body{overflow-x:hidden; overflow-y:auto}
    #track{display:block; height:auto; overflow:visible; scroll-snap-type:none}
    .panel{width:auto; height:auto; min-height:0; padding:calc(var(--header-h) + 16px) 20px 40px; scroll-snap-align:none; scroll-margin-top:calc(var(--header-h) + 8px)}
    .panel-inner{overflow-y:visible}
    .stop-grid{grid-template-columns:1fr}
    .hero-box{min-height:180px}
    .edge-btn{display:none}
    header{padding:0 14px}
    .head-status{display:none}
    .brand{font-size:12px}
    .progress-arrow button{min-width:78px; font-size:10px}
  }
  @media (prefers-reduced-motion:reduce){
    #track{scroll-behavior:auto}
  }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <a class="brand" href="https://marcinfracz.github.io/" aria-label="Marcin Fracz - back to the desktop"><span class="home-ico" aria-hidden="true">&#8962;</span> MARCIN FRACZ <span>&mdash; THE ROAD</span></a>
    <div class="head-links">
      <span class="head-status" id="stop-status" aria-live="polite"></span>
      <a href="/assets/resume.pdf">Resume</a>
      <a href="mailto:marcin.fracz@gmail.com">Contact</a>
      <button id="theme-toggle" type="button" aria-label="Switch to dark mode">&#9789;</button>
    </div>
  </div>
  <nav class="progress-arrow" id="progress-arrow" aria-label="Career eras, left to right"></nav>
</header>

<button class="edge-btn" id="prev-btn" type="button" aria-label="Previous stop">&#8592;</button>
<button class="edge-btn" id="next-btn" type="button" aria-label="Next stop">&#8594;</button>

<main id="track" aria-label="The Road, v3 greybox"></main>

<script src="content/content.js"></script>
<script>
(function(){
  "use strict";
  /* matchMedia is universal in real browsers; this guard only keeps the
     page from dying outright in test harnesses that lack it. */
  if (!window.matchMedia) {
    window.matchMedia = function(q){ return { matches:false, media:q, addEventListener:function(){}, addListener:function(){} }; };
  }
  var data = window.ROAD_V3;
  var track = document.getElementById("track");
  if (!data || !data.eras) {
    track.innerHTML = '<div class="error-box"><b>ROAD_V3 text failed to load.</b><br>content/content.js did not provide window.ROAD_V3. Nothing else is rendered on purpose.</div>';
    return;
  }
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var isPhone = function(){ return window.matchMedia("(max-width: 767px)").matches; };
  var esc = function(s){
    return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  };
  var OPEN = "[OPEN]";

  /* ---------- build the stop list: intro + 13 era/sub stops + finale ---------- */
  var stops = []; /* {id, eraId, kind, era, stop} */
  stops.push({ id:"intro", eraId:null, kind:"intro" });
  data.eras.forEach(function(era){
    era.stops.forEach(function(stop){
      stops.push({ id: stop.id, eraId: era.id, kind:"era", era: era, stop: stop });
    });
  });
  stops.push({ id:"finale", eraId:null, kind:"finale" });
  var eraFirstStop = {};
  data.eras.forEach(function(era){ eraFirstStop[era.id] = era.stops[0].id; });

  /* ---------- render ---------- */
  function stopCardHTML(era, stop){
    var wins = stop.wins.map(function(w){
      return "<li>" + esc(w) + "</li>";
    }).join("");
    var moreBtn = stop.more
      ? '<button type="button" class="more-btn" aria-expanded="false">More: ' + esc(stop.more.title) + '</button>'
      : '<button type="button" class="more-btn" aria-expanded="false" disabled style="opacity:.45; cursor:default">More: story to come ' + OPEN + '</button>';
    return '<div class="stop-card">'
      + '<div class="stop-kicker">' + esc(era.num) + ' / 7 &middot; ' + esc(stop.sub) + ' &middot; ' + esc(stop.years) + '</div>'
      + '<h2>' + esc(stop.title) + '</h2>'
      + '<p class="role">' + esc(stop.role) + '</p>'
      + '<p class="meta">' + esc(stop.company) + ' &middot; ' + esc(stop.place) + ' &middot; ' + esc(stop.years) + '</p>'
      + '<p class="what">' + esc(stop.what) + '</p>'
      + '<ul class="wins">' + wins + '</ul>'
      + moreBtn
      + '</div>';
  }
  function heroHTML(stop){
    return '<div class="hero-box" aria-label="Placeholder for the 3D hero object">'
      + '<span class="ph-label">3D hero object &mdash; placeholder</span>'
      + '<div class="ph-title">' + esc(stop.hero.label) + '</div>'
      + '<div class="ph-note">' + esc(stop.hero.note) + '</div>'
      + '</div>';
  }
  function calloutsHTML(stop){
    if (!stop.callouts || !stop.callouts.length) {
      return '<div class="callouts"><p class="callout-none">No callouts at this stop.</p></div>';
    }
    var items = stop.callouts.map(function(c, i){
      return '<div class="callout-box"><span class="ph-label">Callout ' + (i + 1) + ' &mdash; placeholder</span>'
        + '<div class="ph-title">' + esc(c.label) + '</div>'
        + '<p>' + esc(c.text) + '</p></div>';
    }).join("");
    return '<div class="callouts">' + items + '</div>';
  }
  function panelHTML(s){
    if (s.kind === "intro") {
      return '<section class="panel panel-intro" data-stop="intro" aria-label="Introduction">'
        + '<div class="panel-inner"><div class="stop-kicker">Marcin Fracz &middot; ' + esc(data.positioning) + '</div>'
        + '<h1>THE<br>ROAD<em>.</em></h1>'
        + '<p class="lede">' + esc(data.intro.lede) + '</p>'
        + '<p class="tagline">' + esc(data.tagline) + '</p>'
        + '<p class="hint">' + esc(data.intro.hint) + '</p></div></section>';
    }
    if (s.kind === "finale") {
      return '<section class="panel panel-finale" data-stop="finale" aria-label="Finale">'
        + '<div class="panel-inner"><div class="stop-kicker">The road continues</div>'
        + '<h2>' + esc(data.finale.title) + '</h2>'
        + '<p>' + esc(data.finale.text) + '</p>'
        + '<div class="hero-box" style="margin-top:22px; min-height:150px"><span class="ph-label">Reel finale &mdash; placeholder</span><div class="ph-title">' + esc(data.finale.reelLabel) + '</div><div class="ph-note">' + esc(data.finale.reelNote) + '</div></div>'
        + '<a class="home-btn" href="https://marcinfracz.github.io/">Back to the desktop</a>'
        + '<div class="fine-links"><a href="mailto:marcin.fracz@gmail.com">marcin.fracz@gmail.com</a><a href="https://www.linkedin.com/in/marcinfracz/">LinkedIn</a><a href="/assets/resume.pdf">Resume</a></div>'
        + '</div></section>';
    }
    var stop = s.stop, era = s.era;
    var moreBox = stop.more
      ? '<div class="more-box" hidden><h3>More: ' + esc(stop.more.title) + '</h3><p>' + esc(stop.more.text) + '</p></div>'
      : '<div class="more-box" hidden><h3>More</h3><p>Story to come. ' + OPEN + ' No story is written for this stop in the brief yet.</p></div>';
    var noteBox = stop.note
      ? '<div class="note-box"><b>Note (review only):</b> ' + esc(stop.note) + '</div>'
      : "";
    return '<section class="panel panel-era" data-stop="' + esc(stop.id) + '" data-era="' + esc(era.id) + '" aria-label="' + esc(stop.title) + '">'
      + '<div class="panel-inner"><div class="stop-grid">'
      + stopCardHTML(era, stop)
      + heroHTML(stop)
      + calloutsHTML(stop)
      + moreBox + noteBox
      + '</div></div></section>';
  }
  track.innerHTML = stops.map(panelHTML).join("");

  /* ---------- progress arrow (7 eras) ---------- */
  var arrow = document.getElementById("progress-arrow");
  var arrowLabels = { engineering:"Engineering", equinox:"Equinox", trailblazer:"Trailblazer", connected:"Connected", shanghai:"Shanghai", onstar:"OnStar", now:"Now" };
  arrow.innerHTML = data.eras.map(function(era){
    return '<button type="button" data-era="' + esc(era.id) + '">' + (era.num) + '. ' + esc(arrowLabels[era.id] || era.title) + '</button>';
  }).join("");
  arrow.addEventListener("click", function(e){
    var b = e.target.closest("button[data-era]");
    if (b) goTo(indexOfStop(eraFirstStop[b.getAttribute("data-era")]));
  });

  /* ---------- navigation ---------- */
  var panels = Array.prototype.slice.call(track.querySelectorAll(".panel"));
  var statusEl = document.getElementById("stop-status");
  var prevBtn = document.getElementById("prev-btn");
  var nextBtn = document.getElementById("next-btn");
  var current = 0, wheelLock = false;

  function indexOfStop(id){
    for (var i = 0; i < stops.length; i++) if (stops[i].id === id) return i;
    return 0;
  }
  /* Deep links from the brief: #shanghai, #pentastar etc. jump to that
     era or sub-stop. A multi-stop era is addressed by its sub-stop id
     (1a, 2c); a single-stop era by its era id (shanghai, onstar, now).
     #pentastar is an alias for the gasket stop 1a. */
  function hashForStop(s){
    if (s.kind === "era") return s.era.stops.length > 1 ? s.id : s.eraId;
    return s.id;
  }
  function indexOfHash(h){
    h = (h || "").replace(/^#/, "");
    if (!h) return 0;
    if (h === "pentastar") return indexOfStop("1a");
    for (var i = 0; i < stops.length; i++) {
      if (stops[i].id === h) return i;
      if (stops[i].eraId === h) return i;
    }
    return 0;
  }
  function panelLeft(i){ return panels[i].offsetLeft; }
  function goTo(i, instant){
    i = Math.max(0, Math.min(stops.length - 1, i));
    current = i;
    if (isPhone()) {
      try {
        if (panels[i].scrollIntoView) panels[i].scrollIntoView({ behavior: (instant || reduce) ? "auto" : "smooth", block: "start" });
      } catch (e) {}
    } else {
      var behavior = (instant || reduce) ? "auto" : "smooth";
      try {
        if (track.scrollTo) track.scrollTo({ left: panelLeft(i), behavior: behavior });
        else track.scrollLeft = panelLeft(i);
      } catch (e) { track.scrollLeft = panelLeft(i); }
    }
    update(i);
  }
  function update(i){
    if (typeof i === "number") current = i;
    statusEl.textContent = "Stop " + (current + 1) + " of " + stops.length;
    prevBtn.disabled = current <= 0;
    nextBtn.disabled = current >= stops.length - 1;
    var eraId = stops[current].eraId;
    arrow.querySelectorAll("button").forEach(function(b){
      if (b.getAttribute("data-era") === eraId) b.setAttribute("aria-current", "true");
      else b.removeAttribute("aria-current");
    });
    var stopId = stops[current].id;
    if (stopId) {
      try { history.replaceState(null, "", "#" + hashForStop(stops[current])); } catch (e) {}
    }
    try {
      if (eraId) localStorage.setItem("road-last-era", eraId);
    } catch (e) {}
  }
  prevBtn.addEventListener("click", function(){ goTo(current - 1); });
  nextBtn.addEventListener("click", function(){ goTo(current + 1); });

  /* wheel + trackpad: deltaY and deltaX both drive left/right (desktop only) */
  track.addEventListener("wheel", function(e){
    if (isPhone()) return;
    e.preventDefault();
    if (wheelLock) return;
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (Math.abs(d) < 8) return;
    wheelLock = true;
    setTimeout(function(){ wheelLock = false; }, 450);
    goTo(current + (d > 0 ? 1 : -1));
  }, { passive:false });

  /* drag / swipe: pointer drag moves the track, release snaps to nearest stop */
  var dragging = false, dragMoved = 0, dragStartX = 0, dragStartLeft = 0;
  track.addEventListener("pointerdown", function(e){
    if (isPhone() || e.target.closest("button, a")) return;
    dragging = true; dragMoved = 0;
    dragStartX = e.clientX; dragStartLeft = track.scrollLeft;
    track.setPointerCapture(e.pointerId);
    track.style.scrollSnapType = "none";
  });
  track.addEventListener("pointermove", function(e){
    if (!dragging) return;
    var dx = e.clientX - dragStartX;
    dragMoved = Math.max(dragMoved, Math.abs(dx));
    track.scrollLeft = dragStartLeft - dx;
  });
  function endDrag(){
    if (!dragging) return;
    dragging = false;
    track.style.scrollSnapType = "";
    var nearest = 0, best = Infinity;
    panels.forEach(function(p, i){
      var d = Math.abs(p.offsetLeft - track.scrollLeft);
      if (d < best) { best = d; nearest = i; }
    });
    goTo(nearest);
  }
  track.addEventListener("pointerup", endDrag);
  track.addEventListener("pointercancel", endDrag);
  track.addEventListener("click", function(e){
    if (dragMoved > 6) { e.preventDefault(); e.stopPropagation(); }
  }, true);

  /* scroll (incl. touch swipe): keep current/stauts in sync */
  var scrollTick = false;
  track.addEventListener("scroll", function(){
    if (isPhone() || scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(function(){
      scrollTick = false;
      var nearest = 0, best = Infinity;
      panels.forEach(function(p, i){
        var d = Math.abs(p.offsetLeft - track.scrollLeft);
        if (d < best) { best = d; nearest = i; }
      });
      if (nearest !== current) update(nearest);
    });
  }, { passive:true });

  /* keyboard: arrows, PageUp/Down, Space; Esc / H go home */
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" || e.key === "h" || e.key === "H") {
      window.location.href = "https://marcinfracz.github.io/";
      return;
    }
    if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !e.shiftKey)) {
      e.preventDefault(); goTo(current + 1);
    } else if (e.key === "ArrowLeft" || e.key === "PageUp" || (e.key === " " && e.shiftKey)) {
      e.preventDefault(); goTo(current - 1);
    } else if (e.key === "Home") { e.preventDefault(); goTo(0); }
    else if (e.key === "End") { e.preventDefault(); goTo(stops.length - 1); }
  });

  /* More buttons reveal new info (the only click that changes content) */
  track.addEventListener("click", function(e){
    var b = e.target.closest(".more-btn");
    if (!b || b.disabled) return;
    var panel = b.closest(".panel");
    var box = panel.querySelector(".more-box");
    var open = box.hasAttribute("hidden");
    if (open) box.removeAttribute("hidden"); else box.setAttribute("hidden", "");
    b.setAttribute("aria-expanded", open ? "true" : "false");
  });

  /* ---------- theme: light default, saved choice wins, else system ---------- */
  var themeBtn = document.getElementById("theme-toggle");
  function applyTheme(t){
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("road-theme", t); } catch (e) {}
    themeBtn.textContent = t === "dark" ? "\u2600" : "\u263E";
    themeBtn.setAttribute("aria-label", t === "dark" ? "Switch to light mode" : "Switch to dark mode");
  }
  var savedTheme = null;
  try { savedTheme = localStorage.getItem("road-theme"); } catch (e) {}
  applyTheme(savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
  themeBtn.addEventListener("click", function(){
    applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
  });

  /* ---------- deep link / last-visited era ---------- */
  var start = 0;
  var hash = window.location.hash || "";
  if (hash) start = indexOfHash(hash);
  else {
    try {
      var last = localStorage.getItem("road-last-era");
      if (last && eraFirstStop[last]) start = indexOfStop(eraFirstStop[last]);
    } catch (e) {}
  }
  window.addEventListener("load", function(){ goTo(start, true); });
  goTo(start, true);
})();
</script>
</body>
</html>
