<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work · Marcin Fracz</title>
<meta name="description" content="Marcin Fracz's career from 2003 to now on one timeline: engineering, product marketing, customer experience, and software and connected-services strategy at GM and SAIC-GM.">
<meta name="theme-color" content="#E9EDF2">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  /* theme before first paint: shared with the desktop and the Road */
  (function () {
    var dark = null;
    try { var p = JSON.parse(localStorage.getItem("mf-site-prefs-v6") || "{}"); if (typeof p.dark === "boolean") dark = p.dark; } catch (e) {}
    if (dark === null) { try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { dark = false; } }
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  })();
</script>
<style>
:root{
  --bg1:#eef1f5;--bg2:#dfe5ec;--ink:#1e2124;--ink2:#4a5360;--muted:#6b7684;--line:rgba(30,33,36,.14);--rule:rgba(30,33,36,.3);
  --glass:rgba(255,255,255,.78);--glass-line:rgba(30,33,36,.10);--surface:#fbfbfa;--surface2:#f1f3f5;
  --axis:#3b4250;--axis-e:#8d9aab;--star:rgba(60,72,90,.16);
  --f-product:#6b7380;--f-cx:#99730f;--f-field:#11804a;--f-digital:#0d2463;--f-eng:#66788f;--now:#2fa36b;
  --cap-bg:#00274c;--cap-fg:#ffcb05;--ring:#fff;--shade:rgba(10,14,22,.72);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg1:#141a24;--bg2:#0a0e15;--ink:#eef1f5;--ink2:#c3cad4;--muted:#8c96a4;--line:rgba(255,255,255,.14);--rule:rgba(255,255,255,.3);
  --glass:rgba(22,28,38,.78);--glass-line:rgba(255,255,255,.10);--surface:#171c25;--surface2:#1e2530;
  --axis:#c9cfd8;--axis-e:#6f7b8c;--star:rgba(220,230,255,.22);
  --f-digital:#2a4aa8;--ring:#141a24;--shade:rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:14px/1.45 var(--font);color:var(--ink);background:radial-gradient(120% 90% at 50% 45%,var(--bg1),var(--bg2));-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}

/* the sky: a faint dot field that drifts slower than the timeline */
.sky{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(var(--star) 1px,transparent 1.4px),radial-gradient(var(--star) .8px,transparent 1.2px);background-size:46px 46px,23px 23px;background-position:0 0,11px 17px}

/* top bar, like the Road */
.bar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid var(--glass-line);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 6px 20px -12px rgba(0,0,0,.35);padding:4px}
.brand{gap:9px;padding-right:13px;text-decoration:none;font-weight:700;font-size:14.5px;white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--ring)}
.brand span{color:var(--muted);font-weight:500}
.links a,.links button{display:flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:999px;text-decoration:none;font-weight:600;font-size:13.5px;border:0;background:none;cursor:pointer;white-space:nowrap}
.links a:hover,.links button:hover{background:var(--surface2)}
.links .sep{width:1px;height:16px;background:var(--line);margin:0 2px}
.theme-btn{width:32px;justify-content:center;padding:0!important}
html[data-theme="dark"] .sun,html:not([data-theme="dark"]) .moon{display:none}

.intro{position:fixed;z-index:5;left:max(20px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 62px);right:20px;pointer-events:none}
.intro h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.intro p{margin:2px 0 0;color:var(--muted);font-size:13px}

/* the stage */
.stage{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;outline:none}
.stage.grabbing{cursor:grabbing}
#layer{position:absolute;inset:0}
#layer>*{position:absolute;left:0;top:0;will-change:transform}
.ax{height:3px;border-radius:2px;background:var(--axis)}
.ax.e{background:var(--axis-e)}
.ax.gm::after{content:"";position:absolute;right:-9px;top:-5px;border-left:11px solid var(--axis);border-top:6.5px solid transparent;border-bottom:6.5px solid transparent}
.tk{font-size:10.5px;font-weight:600;letter-spacing:.05em;color:var(--ink2);white-space:nowrap}
.tk::after{content:"";position:absolute;left:-4px;top:15px;width:1px;height:12px;background:var(--axis);opacity:.45}
.tk.e{color:var(--muted)}

/* role boxes: the Work look, solid colour by focus area */
.bx{display:flex;flex-direction:column;gap:3px;padding:8px 10px 8px 11px;border-radius:8px;color:#fff;text-decoration:none;overflow:hidden;box-shadow:0 8px 20px -10px rgba(10,16,28,.45);transition:opacity .25s,box-shadow .15s,filter .15s;cursor:pointer}
.bx:hover,.bx:focus-visible{box-shadow:0 14px 28px -10px rgba(10,16,28,.6);filter:brightness(1.08)}
.bx:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
html[data-theme="dark"] .bx{box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 24px -12px rgba(0,0,0,.7)}
.f-product{background:var(--f-product)}.f-cx{background:var(--f-cx)}.f-field{background:var(--f-field)}.f-digital{background:var(--f-digital)}.f-eng{background:var(--f-eng)}
.bx-flag{position:absolute;right:8px;top:7px;width:20px;height:20px;line-height:0}
.rf{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;line-height:0;background:#dfe3e8;box-shadow:0 0 0 1.5px rgba(255,255,255,.95),0 3px 8px rgba(0,0,0,.24)}
.rf img,.rf svg{width:100%;height:100%;object-fit:cover;display:block}
.bx>*{flex-shrink:0}
.bx-k{font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.86;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx.has-flag .bx-k{padding-right:28px}
.bx-t{font-size:12px;font-weight:700;line-height:1.22;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.bx-g{display:none;font-size:10px;font-weight:700;line-height:1.14;overflow:hidden;-webkit-box-orient:vertical;-webkit-line-clamp:4;hyphens:auto}
.z-xs .bx-s{display:none!important}.z-xs .bx-g{display:-webkit-box}.z-xs.xs-low .bx-g{-webkit-line-clamp:2}.z-xs .bx{justify-content:flex-start}
.bx-s{display:none;font-size:11px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx-sum{display:none;font-size:13px;line-height:1.42;opacity:.93;overflow:hidden;-webkit-box-orient:vertical}
.bx-hl{display:none;flex-shrink:1!important;min-height:0;overflow:hidden;margin:2px 0 0;padding:0;list-style:none;font-size:12.5px;line-height:1.35}
.bx-hl li{position:relative;padding-left:12px;margin-top:3px}
.bx-hl li::before{content:"";position:absolute;left:0;top:.5em;width:5px;height:5px;border-radius:1px;background:currentColor;opacity:.7}
.bx-hl b{font-weight:800}
.bx-y{margin-top:auto;font-size:10.5px;font-weight:600;opacity:.85;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bx-go{display:none;font-weight:700;opacity:.95;white-space:nowrap}
.bx.dim{opacity:.28}
/* semantic zoom: more detail as you zoom in */
.z-xs .bx{padding:6px 7px;justify-content:center}
.z-xs .bx-k,.z-xs .bx-t,.z-xs .bx-y,.z-s .bx-k{display:none}

.tiny .bx-s,.tiny .bx-g{display:none!important}
.z-s .bx-t{display:none}.z-s .bx-s{display:-webkit-box;white-space:normal;font-size:11.5px;line-height:1.2;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.z-s.narrow .bx-s{display:none}.z-s.narrow .bx-g{display:-webkit-box;font-size:11px;line-height:1.16}
.bx-y .yc,.narrow .bx-y .yl{display:none}.narrow .bx-y .yc{display:inline}
.narrow .bx.has-flag .bx-y{padding-right:16px}
.z-m .bx-t,.z-l .bx-t{display:none}.z-m .bx-s,.z-l .bx-s{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal;font-size:13px;line-height:1.22}.z-l .bx-s{font-size:15.5px;line-height:1.25}.z-m .bx.has-flag .bx-s{padding-right:24px}.z-l .bx.has-flag .bx-s{padding-right:34px}
.bx.has-flag .bx-t{padding-right:26px}
.narrow .bx-flag{width:15px;height:15px;right:6px;top:auto;bottom:7px}.narrow .bx.has-flag .bx-t,.z-s.narrow .bx.has-flag .bx-s{padding-right:0!important}
.z-xs .bx-flag{width:13px;height:13px;right:5px;top:auto;bottom:5px}
.tiny .bx.has-flag{justify-content:flex-end}
.z-s .bx-t{font-size:11.5px;-webkit-line-clamp:3}
.z-s .bx.has-flag .bx-t,.z-s .bx.has-flag .bx-s{padding-right:24px}
.z-l .bx,.z-xl .bx{padding:13px 16px 12px 16px;gap:5px;border-radius:11px}
.z-l .bx-flag,.z-xl .bx-flag{width:26px;height:26px;right:12px;top:11px}
.z-l .bx.has-flag .bx-k,.z-xl .bx.has-flag .bx-k,.z-xl .bx.has-flag .bx-t{padding-right:36px}
.z-l .bx-k,.z-xl .bx-k{font-size:10px}
.z-l .bx-t,.z-xl .bx-t{font-size:15.5px;line-height:1.25;-webkit-line-clamp:2}
.z-l .bx-sum{display:-webkit-box;-webkit-line-clamp:3}
.z-xl .bx-sum{display:-webkit-box;-webkit-line-clamp:2;font-size:14px}
.z-xl .bx-hl{display:block}
.z-l .bx-y,.z-xl .bx-y{font-size:12px}
.z-l .bx-go,.z-xl .bx-go{display:inline}

/* chapter brackets above the boxes */
.br{height:12px;border:2px solid var(--axis-e);border-bottom:0;border-radius:6px 6px 0 0;text-decoration:none;cursor:pointer}
.br-l{position:absolute;left:8px;bottom:12px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.br-l i{font-style:normal;font-weight:600;letter-spacing:.05em;color:var(--muted)}
.br-l .s{display:none}
.br.short .br-l .f{display:none}.br.short .br-l .s{display:inline}
.br.none .br-l{display:none}
.br.gmp{border-color:var(--f-cx)}
/* round 28: the top level brackets are taller and frame the level under them */
.br.t1{height:12px;border-width:2px}
.br.t1 .br-l{bottom:12px;font-size:10.5px}
.br.t1.gm{border-color:var(--f-digital)}
.br.t2,.br.t3{height:10px;border-width:1.5px}
.br.t2 .br-l,.br.t3 .br-l{bottom:10px;font-size:9.5px;letter-spacing:.12em}
.br.intl{border-color:var(--f-digital)}
.lk i.lk-box{position:relative;width:16px;height:11px;border-radius:3px;background:var(--f-digital)}
.lk i.lk-box::after{content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;background:linear-gradient(#c8302e 50%,#2e7d4f 50%);box-shadow:0 0 0 1px #fff}
.br:hover .br-l{color:var(--ink);text-decoration:underline}
.lg-chip{display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 8px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 10px -6px rgba(10,16,28,.35);overflow:hidden;transition:opacity .2s}
.lg-chip img{flex:none;height:20px;width:auto;filter:brightness(0);opacity:.86}
.lg-chip b{font-size:10px;font-weight:800;letter-spacing:.07em;line-height:1.05;text-transform:uppercase;color:#2a2f36;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lg-chip.off{opacity:0;pointer-events:none}
.lg-chip.span{justify-content:center}
.narrow .lg-chip{gap:5px;padding:0 7px 0 6px}.narrow .lg-chip b{font-size:9px;letter-spacing:.04em}.narrow .lg-chip img{height:17px}
.lg-chip.cmp{gap:4px;padding:0 6px 0 5px}.lg-chip.cmp b{font-size:8.5px;letter-spacing:.02em;width:min-content}.lg-chip.cmp img{height:16px}
.lg-chip.only b,.tiny .lg-chip b{display:none}.lg-chip.only{padding:0 6px}.tiny .lg-chip{padding:0 4px;height:26px;border-radius:7px}.tiny .lg-chip img{height:15px}
@media (max-width:600px){.z-s.narrow .bx-g{font-size:10px}}
/* v33: small boxes break long words at a syllable instead of clipping them ("Enginee") */
.z-s.narrow .bx-g{font-size:10px!important;line-height:1.16!important;-webkit-line-clamp:4!important}.z-s .bx{padding:7px 5px 7px 6px}.z-s .bx-s{font-size:10.5px!important;line-height:1.18!important;-webkit-line-clamp:4!important}.z-s .bx-s,.z-s .bx-g,.z-m .bx-s{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.zone{font-size:9.5px;font-weight:800;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:opacity .2s}

/* pins under the axis: degrees, country projects, now */
.pin{display:flex;align-items:center;gap:7px;text-decoration:none;color:var(--ink);cursor:pointer}
.pin::before{content:"";position:absolute;left:12px;top:-20px;width:2px;height:20px;background:var(--axis);opacity:.35}
.pin-i{flex:none;width:26px;height:26px;border-radius:50%;overflow:hidden;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ring),0 3px 8px rgba(0,0,0,.22);background:#dfe3e8}
.pin-i img{width:100%;height:100%;object-fit:cover;display:block}
.pin.deg .pin-i{background:var(--cap-bg);color:var(--cap-fg)}
.pin.now .pin-i{background:var(--now);color:#fff}
.pin-t{display:flex;flex-direction:column;line-height:1.15;white-space:nowrap}
.pin-t b{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
.pin-t i{font-style:normal;font-size:10px;color:var(--muted)}
.pin.nolabel .pin-t{display:none}
.pin.deg{flex-direction:column;gap:5px}
.pin.deg::before{left:50%;margin-left:-1px;top:-56px;height:56px}
.pin.deg .pin-t{align-items:center;text-align:center;transform:translateX(var(--sh,0px))}
.pin-lg{display:block;line-height:0;padding:4px 7px;margin-bottom:4px;border-radius:7px;background:#fff;box-shadow:0 0 0 1px var(--line),0 4px 10px -6px rgba(10,16,28,.35)}
.pin-lg img{height:18px;width:auto;display:block}
.pin.hide{visibility:hidden}
.pin:hover .pin-t b{text-decoration:underline}
.pin:focus-visible,.br:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}

/* bottom dock: legend and zoom */
.dock{position:fixed;z-index:10;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none}
.legend{pointer-events:auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 10px;border-radius:14px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lt{font-size:9.5px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.li{font-size:11px;font-weight:700;color:#fff;padding:3px 9px;border-radius:5px}
.lk{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--ink2);margin-left:4px}
.lk i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px var(--ring)}
.zoom{pointer-events:auto;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);flex:none}
.zoom>button{width:34px;height:34px;border-radius:50%;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.zoom>button:hover{background:var(--surface2)}
.zoom>button:disabled{opacity:.35;cursor:default;background:none}
.zoom output{min-width:96px;text-align:center;font-size:12px;font-weight:700;color:var(--ink2)}

/* the role box that takes over the page: one template for every role */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.modal[hidden]{display:none}
.shade{position:absolute;inset:0;background:var(--shade);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .2s ease both}
.sheet{--acc-ink:color-mix(in srgb,var(--acc) 72%,var(--ink));--acc-soft:color-mix(in srgb,var(--acc) 11%,var(--surface));position:relative;width:min(1100px,100%);max-height:100%;overflow:auto;overscroll-behavior:contain;background:var(--surface);color:var(--ink);border-radius:22px;box-shadow:0 40px 100px -24px rgba(0,0,0,.7),0 0 0 1px var(--line);animation:pop .26s cubic-bezier(.2,.8,.2,1) both;outline:none;touch-action:pan-y}
.sheet::-webkit-scrollbar-track{margin:24px 0}
.sheet.sm{width:min(560px,100%)}
html[data-theme="dark"] .sheet{--acc-ink:color-mix(in srgb,var(--acc) 45%,#fff)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}}
.m-x{position:absolute;top:16px;right:16px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:20px;line-height:1;display:grid;place-items:center;z-index:3;color:var(--ink)}
.m-x:hover{background:var(--surface2)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
/* header */
.m-top{position:relative;padding:26px 30px 22px;background:linear-gradient(180deg,var(--acc-soft),var(--surface) 92%);border-bottom:1px solid var(--line)}
.m-top::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--acc)}
.m-hgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;padding-right:46px}
.tile{display:grid;place-items:center;background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(20,30,40,.08),0 8px 22px -14px rgba(0,0,0,.45);height:88px;min-width:88px;max-width:180px;padding:10px 14px}
.tile img{display:block;max-height:64px;max-width:150px;width:auto;height:auto;object-fit:contain}
.tile.wide img{max-height:40px}
.tile.mono{font-weight:800;font-size:20px;letter-spacing:.02em;color:#fff;background:var(--acc)}
.tile.flag{padding:0;overflow:hidden;min-width:0;width:80px;height:80px;border-radius:50%}
.tile.flag img{max-height:none;max-width:none;width:80px;height:80px;object-fit:cover}
.eyebrow{margin:0;font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-ink)}
.m-role{margin:6px 0 0;font-size:clamp(22px,2.6vw,31px);line-height:1.12;font-weight:800;letter-spacing:-.015em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip .ico{width:14px;height:14px;color:var(--muted)}
.chip img{width:16px;height:16px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 1px rgba(0,0,0,.1)}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--acc)}
.m-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;text-decoration:none;cursor:pointer;white-space:nowrap;color:var(--ink)}
.btn:hover{border-color:var(--acc-ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{filter:brightness(1.1)}
.btn .ico{width:16px;height:16px}
