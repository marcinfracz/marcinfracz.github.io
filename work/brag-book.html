<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marcin Fracz · Tools I Built</title>
<meta name="description" content="Ten case studies from Marcin Fracz: the gap, the mechanism he built and the decision it drove, from the 3.6L Pentastar head gasket to Portfolio Made Visible, built with AI agents.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* theme before first paint: shared with the Desktop, the Road and the Timeline */
(function () {
  var dark = null;
  try { var p = JSON.parse(localStorage.getItem('mf-site-prefs-v6') || '{}'); if (typeof p.dark === 'boolean') dark = p.dark; } catch (e) {}
  if (dark === null) { try { dark = matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { dark = false; } }
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
<style>
:root{
  --sky:#E9EDF2;--sky-2:#DFE5EC;--surface:#FAFAF7;--surface-2:#F1F3F5;--line:#D5DCE3;
  --ink:#1E2124;--ink-2:#4A5562;--ink-3:#5E6A78;
  --accent:#E8A33D;--accent-ink:#8A520C;--accent-soft:rgba(232,163,61,.16);
  --data:#2a4aa8;--data-2:#7d93c9;--data-3:#c3cee6;--gap:#C2412D;--ok:#11804a;
  --c-eng:#66788f;--c-edu:#B14F94;--c-prod:#b8890f;--c-dig:#2a4aa8;
  --shadow:0 10px 30px rgba(30,40,55,.10),0 1px 2px rgba(30,40,55,.08);
  --glass:rgba(250,250,247,.86);
  --font:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
html[data-theme="dark"]{
  --sky:#0E1114;--sky-2:#13171c;--surface:#161A20;--surface-2:#1C2128;--line:#2C333D;
  --ink:#ECEEF1;--ink-2:#B5BDC8;--ink-3:#8A94A1;
  --accent:#F2B456;--accent-ink:#F2B456;--accent-soft:rgba(242,180,86,.14);
  --data:#6f8fe8;--data-2:#4a5f95;--data-3:#2c3a5c;--gap:#F07A5F;--ok:#2fb36b;
  --c-eng:#8fa1b8;--c-edu:#d98bc2;--c-prod:#e0b232;--c-dig:#6f8fe8;
  --shadow:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --glass:rgba(22,26,32,.86);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--sky)}
body{margin:0;min-height:100vh;font:15px/1.5 var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;background:var(--sky)}
a{color:inherit}
button{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar (same pills as the Road) ---------- */
.bar{position:fixed;z-index:30;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;pointer-events:none}
.pill{pointer-events:auto;display:flex;align-items:center;gap:2px;background:var(--glass);border:1px solid color-mix(in srgb,var(--ink) 8%,transparent);border-radius:999px;box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.brand{gap:10px;padding:5px 16px 5px 5px;text-decoration:none;font:700 14px/1 var(--font)}
.brand img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.brand span{color:var(--ink-3);font-weight:600}
nav.pill.links{padding:4px 6px}
nav.pill.links>a{padding:9px 12px;border-radius:999px;text-decoration:none;font:600 13.5px/1 var(--font);color:var(--ink);white-space:nowrap}
nav.pill.links>a:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
nav.pill.links>a.cur{box-shadow:inset 0 -2px 0 var(--accent);border-radius:0;padding-bottom:8px}
nav.pill.links .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.theme-btn{border:0;background:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.theme-btn:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.theme-btn svg{width:17px;height:17px}
html[data-theme="dark"] .theme-btn .sun,html:not([data-theme="dark"]) .theme-btn .moon{display:none}

/* ---------- page ---------- */
main{max-width:1600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 86px) clamp(16px,3.2vw,56px) 64px}
.lead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap}
.kick{margin:0;font:800 12px/1 var(--font);letter-spacing:.16em;text-transform:uppercase;color:var(--accent-ink)}
.lead h1{margin:10px 0 0;font:800 clamp(30px,3vw,46px)/1.05 var(--font);letter-spacing:-.025em;text-wrap:balance}
.lead p.sub{margin:10px 0 0;color:var(--ink-2);font-size:16px;max-width:72ch}
.legend{display:flex;gap:18px;flex-wrap:wrap;font:600 12.5px/1 var(--font);color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;vertical-align:-1px;background:var(--c)}

/* ---------- the arrow ---------- */
.track-wrap{margin:26px -8px 0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track-wrap::-webkit-scrollbar{display:none}
.track{position:relative;height:150px;min-width:1200px;margin:0 8px}
.track svg.axis{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.axis .ln{stroke:var(--ink);stroke-width:2.2}
.axis .hd{fill:var(--ink)}
.axis .tk{stroke:var(--ink-3);stroke-width:1}
.axis .yr{fill:var(--ink-3);font:600 11px var(--font)}
.axis .band{stroke-width:4;stroke-linecap:round;opacity:.9}
.node{position:absolute;top:70px;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;z-index:2}
.node::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2.5px var(--c);transition:transform .2s,background .2s,box-shadow .2s}
.node:hover::before{transform:scale(1.25)}
.node.on::before{background:var(--accent);box-shadow:0 0 0 2.5px var(--accent),0 0 0 8px var(--accent-soft);transform:scale(1.3)}
.node .lb{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:104px;white-space:normal;text-align:center;font:600 12px/1.2 var(--font);color:var(--ink-2);pointer-events:none;text-wrap:balance}
.node.up .lb{bottom:28px}
.node:not(.up) .lb{top:28px}
.node.on .lb{color:var(--ink);font-weight:800}
.node .lb small{display:block;font:600 10.5px/1.3 var(--font);color:var(--ink-3)}

/* ---------- case ---------- */
.case{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:clamp(28px,3.4vw,64px);margin-top:22px;align-items:start}
.case.swap{animation:swap .45s cubic-bezier(.2,.7,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.case.swap{animation:none}}
.c-left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 82px)}
.org{display:flex;align-items:center;gap:14px;min-height:34px}
.org .logos{display:flex;gap:10px;align-items:center;flex:none}
.org .logos img{height:24px;width:auto;max-width:120px;object-fit:contain;opacity:.88}
.org .logos img.sq{height:30px}
.org .logos .chip{height:34px;padding:3px 7px;border-radius:9px;background:#fff;box-shadow:0 0 0 1px rgba(20,30,40,.1);display:grid;place-items:center}
.org .logos .chip img{height:26px;opacity:1}
.org .logos .mono{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:800 12px/1 var(--font)}
html[data-theme="dark"] .org .logos>img:not(.keep){filter:invert(1);opacity:.9}
.org .logos img.keep{opacity:1}
.org .meta{font:700 12px/1.35 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.c-left h2{margin:14px 0 0;font:800 clamp(30px,2.7vw,42px)/1.06 var(--font);letter-spacing:-.025em;text-wrap:balance}
.thesis{margin:12px 0 0;font:500 18px/1.45 var(--font);color:var(--ink-2);text-wrap:pretty}
ol.steps{list-style:none;margin:26px 0 0;padding:0;position:relative}
ol.steps::before{content:"";position:absolute;left:11px;top:12px;bottom:14px;width:2px;background:var(--line)}
ol.steps li{position:relative;padding:0 0 18px 40px}
ol.steps li:last-child{padding-bottom:0}
ol.steps .n{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--sky);box-shadow:inset 0 0 0 2px var(--ink-3);font:800 11px/1 var(--font);color:var(--ink-2)}
ol.steps li.win .n{background:var(--accent);box-shadow:none;color:#1E2124}
ol.steps .k{display:block;font:800 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:5px 0 7px}
ol.steps li.win .k{color:var(--accent-ink)}
ol.steps p{margin:0;font-size:15px;line-height:1.55;text-wrap:pretty}
ol.steps li.win p{font-weight:600}
.figs{display:flex;flex-wrap:wrap;gap:16px 0;margin:26px 0 0;padding:0}
.fig{padding:0 20px;border-left:1px solid var(--line);min-width:0}
.fig:first-child{padding-left:0;border-left:0}
.fig b{display:block;font:800 30px/1 var(--font);letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.fig b.lg{font-size:24px;padding-top:6px}
.fig span{display:block;margin-top:6px;font:600 12px/1.3 var(--font);color:var(--ink-3);max-width:14ch}
.c-acts{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 18px;border-radius:999px;border:0;cursor:pointer;text-decoration:none;font:700 14px/1 var(--font)}
.btn.pri{background:var(--accent);color:#1E2124;box-shadow:0 6px 16px -6px rgba(232,163,61,.7)}
.btn.pri:hover{filter:brightness(1.04)}
.btn.ghost{background:var(--glass);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.btn.sm{min-height:34px;padding:0 14px;font-size:12.5px}
.btn svg{width:16px;height:16px}

/* ---------- exhibit ---------- */
.exhibit{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px 20px 18px;min-width:0}
.ex-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:30px}
.ex-head h3{margin:0;font:800 15px/1.2 var(--font)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;cursor:pointer;padding:7px 13px;border-radius:999px;font:600 12.5px/1 var(--font);color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line)}
.tag{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.ex-body{margin-top:14px;min-height:300px;position:relative}
.ex-note{margin:12px 0 0;font-size:12.5px;line-height:1.45;color:var(--ink-3)}
.ctrl-row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;cursor:pointer;padding:7px 12px;border-radius:999px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);font:600 12.5px/1 var(--font);color:var(--ink-2)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);box-shadow:none}
.read{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:12px;font:600 13px/1.3 var(--font);color:var(--ink-3)}
.read b{font:800 20px/1 var(--font);color:var(--ink);margin-right:6px;letter-spacing:-.01em}
.read b.bad{color:var(--gap)}.read b.good{color:var(--ok)}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:600 12.5px/1 var(--font);color:var(--ink-2);user-select:none}
.sw input{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .2s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
.sw input:checked{background:var(--accent)}.sw input:checked::after{left:17px}
.rng{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font:600 12.5px/1.2 var(--font);color:var(--ink-2);min-width:220px;flex:1}
.rng output{font:800 13px/1 var(--font);color:var(--ink);min-width:42px;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent)}
svg.viz{display:block;width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--font)}
.viz .t{fill:var(--ink);font-size:13px;font-weight:600}
.viz .ts{fill:var(--ink-3);font-size:11.5px;font-weight:600}
.viz .tb{fill:var(--ink);font-size:13px;font-weight:800}
.viz .grid{stroke:var(--line);stroke-width:1}
.viz .gap-bar{fill:none;stroke:var(--gap);stroke-width:1.6;stroke-dasharray:4 3}
.tlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0 34px}
.tlist li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.tlist .no{font:800 12px/1.6 var(--font);color:var(--accent-ink)}
.tlist b{font-weight:800}
.tlist .d{color:var(--ink-2);font-size:14px;margin-top:2px}

/* ---------- how it works ---------- */
.flow{margin-top:22px;padding:0 4px}
.flow .k{font:800 11px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.flow ol{list-style:none;margin:16px 0 0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:relative}
.flow ol::before{content:"";position:absolute;left:0;right:12px;top:8px;height:2px;background:var(--ink-3);opacity:.45}
.flow ol::after{content:"";position:absolute;right:2px;top:3px;border:6px solid transparent;border-left:9px solid var(--ink-3);opacity:.6}
.flow li{position:relative;padding:28px 12px 0 0;font:600 13px/1.35 var(--font);color:var(--ink-2);text-wrap:balance}
.flow li::before{content:"";position:absolute;left:0;top:2px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2.5px var(--ink-3)}
.flow li:last-child::before{background:var(--accent);box-shadow:0 0 0 2.5px var(--accent)}
.flow li:last-child{color:var(--ink);font-weight:700}

.pager{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:1px solid var(--line)}
.pager button{border:0;background:none;cursor:pointer;text-align:left;padding:6px 0;font:600 13px/1.3 var(--font);color:var(--ink-3);max-width:48%}
.pager button b{display:block;font:800 16px/1.25 var(--font);color:var(--ink)}
.pager button:last-child{text-align:right}
.pager button:hover b{color:var(--accent-ink)}
.foot{margin-top:28px;font-size:12.5px;color:var(--ink-3)}
.foot a{color:var(--ink-2)}

/* ---------- tablet / phone ---------- */
@media (max-width:1100px){
  .case{grid-template-columns:minmax(0,1fr)}
  .org{flex-wrap:wrap;gap:8px 14px}
  .org .meta{min-width:0}
  .c-left{position:static}
}
@media (max-width:767px){
  main{padding-top:calc(env(safe-area-inset-top,0px) + 78px);padding-bottom:40px}
  .brand span{display:none}
  .lead h1{font-size:28px}
  .lead p.sub{font-size:15px}
  .legend{gap:12px;font-size:12px}
  .track-wrap{margin-top:14px}
  .track{min-width:1500px}
  .node .lb{max-width:118px}
  .c-left h2{font-size:30px}
  .thesis{font-size:16.5px}
  .fig{padding:0 14px}
  .fig b{font-size:24px}
  .exhibit{padding:14px 12px 14px;border-radius:16px;margin:0 -4px}
  .tag{margin-left:0}
  .seg button,.chips button{min-height:36px}
  .flow ol{grid-auto-flow:row;grid-auto-columns:auto}
  .flow ol::before{left:6px;right:auto;top:8px;bottom:8px;width:2px;height:auto}
  .flow ol::after{display:none}
  .flow li{padding:0 0 14px 30px}
  .pager button b{font-size:14.5px}
  .seg{min-width:0;flex-wrap:wrap;border-radius:18px}
  .rng{min-width:0;flex-basis:100%;grid-template-columns:minmax(0,max-content) minmax(90px,1fr) auto}
  .rng>span{white-space:normal}
  .viz .t,.viz .tb{font-size:17px}
  .viz .ts{font-size:15px}
}
</style>
</head>

    <div>
      <p class="kick">Tools I built</p>
      <h1 id="h1">From engine gaskets to AI agents.</h1>
      <p class="sub">Ten case studies. Each one: the gap, the mechanism I built, and the decision it drove.</p>
    </div>
    <div class="legend" aria-hidden="true">
      <span style="--c:var(--c-eng)"><i></i>Engineering</span>
      <span style="--c:var(--c-edu)"><i></i>MBA</span>

function drawAxis(){var old=track.querySelector('svg.axis');if(old)old.remove();var W=track.clientWidth,Hh=150,ly=70;
  var svg=S('svg',{class:'axis','aria-hidden':'true',viewBox:'0 0 '+W+' '+Hh,preserveAspectRatio:'none'});track.insertBefore(svg,track.firstChild);
  function X(y){return W*pct(y)/100}
  S('line',{x1:0,x2:W-14,y1:ly,y2:ly,class:'ln'},svg);S('path',{d:'M'+(W-16)+' '+(ly-7)+' L'+W+' '+ly+' L'+(W-16)+' '+(ly+7)+'z',class:'hd'},svg);
  for(var y=2007;y<=2027;y++){var x=X(y);S('line',{x1:x,x2:x,y1:ly-4,y2:ly+4,class:'tk'},svg)}
  [2007,2010,2013,2016,2019,2022,2025].forEach(function(y){S('text',{x:X(y),y:Hh-4,'text-anchor':'middle',class:'yr'},svg,y)});
  S('text',{x:W-2,y:Hh-4,'text-anchor':'end',class:'yr'},svg,'Now');
}
