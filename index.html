<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcin Fracz</title>
<meta name="description" content="Marcin Fracz: strategist transforming global software and AI ecosystems with high-velocity, cross-border execution.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=6">
</head>
<body>
<div class="wallpaper" aria-hidden="true"><img id="wallpaper-img" src="assets/skyline.jpg" alt=""></div>

<header class="menubar">
  <div class="mb-left">
    <span class="mb-name">Marcin Fracz</span>
    <div class="menu">
      <button class="mb-item menu-btn" data-menu="file">File</button>
      <div class="menu-dropdown" id="menu-file">
        <button data-action="open-finder">Open Finder</button>
        <button data-action="open-about">About Marcin</button>
        <button data-action="open-work">Open Work</button>
        <button data-action="open-projects">Open Projects</button>
        <button data-action="open-notes">Open Notes</button>
        <button data-action="contact">Contact Marcin</button>
        <div class="menu-sep"></div>
        <button data-action="search">Search… <span class="kbd">⌘K</span></button>
      </div>
    </div>
    <div class="menu">
      <button class="mb-item menu-btn" data-menu="view">View</button>
      <div class="menu-dropdown" id="menu-view">
        <button data-action="wallpaper-settings">Wallpaper Settings…</button>
        <button data-action="widget-settings">Widget Settings…</button>
        <div class="menu-sep"></div>
        <button data-action="toggle-welcome"><span class="check" id="check-welcome">✓</span> Show Welcome</button>
        <button data-action="reset-positions">Reset Welcome Position</button>
        <button data-action="show-desktop">Show Desktop</button>
        <div class="menu-sep"></div>
        <button data-action="light"><span class="check" id="check-light">✓</span> Light Appearance</button>
        <button data-action="dark"><span class="check" id="check-dark"></span> Dark Appearance</button>
      </div>
    </div>
    <div class="menu">
      <button class="mb-item menu-btn" data-menu="window">Window</button>
      <div class="menu-dropdown" id="menu-window">
        <div id="window-list"></div>
        <div class="menu-sep"></div>
        <button data-action="close-all">Close All Windows</button>
      </div>
    </div>
  </div>
  <div class="mb-right">
    <span class="mb-clock" id="topbar-clock"></span>
    <span class="mb-item">Widgets</span>
  </div>
</header>

<nav class="dock-rail" id="dock-rail" aria-label="Open windows">
  <button data-open="intro" title="Welcome" aria-label="Welcome">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21h-6v-6h-6v6H3z"/></svg>
  </button>
  <button data-open="about" title="About" aria-label="About">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg>
  </button>
  <button data-open="work" title="Work" aria-label="Work">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
  </button>
  <button data-open="projects" title="Projects" aria-label="Projects">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </button>
  <button data-open="sizzle" title="Sizzle Reel" aria-label="Sizzle Reel">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polygon points="10 9 15 12 10 15" fill="currentColor" stroke="none"/></svg>
  </button>
  <span class="rail-sep"></span>
  <button data-open="contact-note" title="Contact" aria-label="Contact">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
  </button>
</nav>

<main class="desktop" id="desktop">

  <!-- Intro card -->
  <section class="window glass intro" id="window-intro" data-window="intro">
    <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Welcome</span></div>
    <div class="window-body intro-body">
      <img class="avatar" id="intro-photo" src="assets/profile.jpg" alt="Marcin Fracz">
      <h1 id="intro-name"></h1>
      <p class="headline" id="intro-headline"></p>
      <div class="intro-buttons" id="intro-buttons"></div>
    </div>
  </section>

  <!-- World clock -->
  <section class="widget glass clocks" id="widget-clocks">
    <h2><span id="clocks-title"></span> <span class="widget-sub" id="clocks-sub"></span></h2>
    <div class="clock-grid" id="clocks"></div>
  </section>

  <!-- AI Signals -->
  <section class="widget glass news" id="widget-news">
    <h2><span id="news-title"></span> <span class="widget-sub" id="news-sub"></span></h2>
    <ul id="news-list"></ul>
  </section>

  <!-- Work -->
  <section class="window glass wide" id="window-work" data-window="work">
    <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Work</span></div>
    <div class="window-body">
      <p class="hint" id="work-note"></p>
      <div class="timeline-controls">
        <button id="zoom-out" aria-label="Zoom out">−</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
      <div class="timeline-viewport">
        <div class="timeline" id="timeline"></div>
      </div>
    </div>
  </section>

  <!-- Sticky notes -->
  <aside class="notes" id="notes">
    <div class="note yellow">
      <p class="note-tag">Motto</p>
      <p class="handwritten" id="note-motto"></p>
    </div>
    <div class="note pink">
      <p class="note-tag">Resume</p>
      <p class="handwritten" id="note-resume"></p>
    </div>
    <div class="note blue" id="contact-note">
      <p class="note-tag">Contact</p>
      <p><a id="note-email" href=""></a></p>
      <p><a id="note-linkedin" href="" target="_blank" rel="noopener"></a></p>
    </div>
  </aside>

</main>

<!-- Overlay windows: open on demand, float above the desktop -->
<section class="window glass overlay-window hidden-window" id="window-about" data-window="about">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">About</span><button class="win-close" data-close="about" aria-label="Close">×</button></div>
  <div class="window-body" id="about-body"></div>
</section>

<section class="window glass overlay-window hidden-window" id="window-projects" data-window="projects">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Projects</span><button class="win-close" data-close="projects" aria-label="Close">×</button></div>
  <div class="window-body" id="projects-body"></div>
</section>

<section class="widget glass overlay-window hidden-window" id="widget-sizzle" data-window="sizzle">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title" id="sizzle-title"></span><button class="win-close" data-close="sizzle" aria-label="Close">×</button></div>
  <div class="window-body">
    <p class="muted" id="sizzle-note"></p>
  </div>
</section>

<section class="window glass overlay-window hidden-window" id="window-finder" data-window="finder">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Finder</span><button class="win-close" data-close="finder" aria-label="Close">×</button></div>
  <div class="window-body">
    <ul class="finder-list">
      <li><button data-open="about">About Marcin</button></li>
      <li><button data-open="work">Work</button></li>
      <li><button data-open="projects">Projects</button></li>
      <li><button data-open="sizzle">Sizzle Reel</button></li>
      <li><button data-open="contact-note">Contact Marcin</button></li>
      <li><span class="finder-dim">Resume — coming soon</span></li>
    </ul>
  </div>
</section>

<section class="window glass overlay-window hidden-window" id="window-wallpaper" data-window="wallpaper">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Wallpaper Settings</span><button class="win-close" data-close="wallpaper" aria-label="Close">×</button></div>
  <div class="window-body">
    <div class="wp-options" id="wp-options"></div>
  </div>
</section>

<section class="window glass overlay-window hidden-window" id="window-widgets" data-window="widgets">
  <div class="window-bar" data-drag><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span><span class="window-title">Widget Settings</span><button class="win-close" data-close="widgets" aria-label="Close">×</button></div>
  <div class="window-body">
    <label class="toggle-row"><input type="checkbox" id="toggle-clocks" checked> World Clock</label>
    <label class="toggle-row"><input type="checkbox" id="toggle-news" checked> AI Signals</label>
    <label class="toggle-row"><input type="checkbox" id="toggle-notes" checked> Sticky Notes</label>
  </div>
</section>

<div class="palette hidden-window" id="palette">
  <input id="palette-input" type="text" placeholder="Search…" autocomplete="off">
  <ul id="palette-list"></ul>
</div>

<div class="art-caption">Shanghai · Lujiazui</div>

<script src="content/content.js?v=6"></script>
<script src="js/app.js?v=6"></script>
</body>
</html>
