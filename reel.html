<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sizzle Reel — Marcin Fracz</title>
<meta name="description" content="Marcin Fracz — automotive strategy and product leader. A 1:41 sizzle reel: hardware and data grounding, global product leadership, strategic execution, amplified by AI.">
<style>
  :root { --paper: #F4F1EA; --ink: #1E2124; --amber: #E8A33D; --muted: #6b6f73; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 40px 20px 64px; }
  .kicker { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  h1 { font-size: clamp(28px, 5vw, 44px); line-height: 1.05; margin: 0 0 10px; letter-spacing: -0.02em; }
  h1 .accent { color: var(--amber); }
  p.lede { font-size: 17px; line-height: 1.55; margin: 0 0 24px; max-width: 640px; }
  .player { border-radius: 12px; overflow: hidden; background: #0f0f11; box-shadow: 0 12px 40px rgba(30,33,36,.18); }
  .player video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; background: #0f0f11; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; font-size: 14px; color: var(--muted); }
  .meta b { color: var(--ink); font-weight: 600; }
  .back { display: inline-block; margin-top: 28px; font-size: 15px; color: var(--ink); text-decoration: none; border-bottom: 2px solid var(--amber); padding-bottom: 2px; }
  .back:hover { color: var(--amber); }
</style>
</head>
<body>
<main class="wrap">
  <p class="kicker">Marcin Fracz</p>
  <h1>Sizzle Reel<span class="accent">.</span></h1>
  <p class="lede">Hardware and data grounding. Global product leadership. Strategic execution. All amplified by AI. One minute, forty-one seconds.</p>
  <div class="player">
    <video controls preload="metadata" poster="assets/sizzle-poster.jpg" playsinline>
      <source src="assets/sizzle-reel-v4.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
  <div class="meta">
    <span>Length <b>1:41</b></span>
    <span>Format <b>1080p</b></span>
    <span>Voice <b>AI narration</b></span>
  </div>
  <a class="back" href="./">Back to the desktop</a>
</main>
</body>
</html>
